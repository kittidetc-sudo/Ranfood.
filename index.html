<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#2b2118;--mute:#7a6a5a;--pri:#e8590c;--pri2:#ffe8d6;--line:#f0dfcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#2a221b;--ink:#f6ebdd;--mute:#b8a692;--pri:#ff8a3d;--pri2:#43301f;--line:#3d3126}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#2a221b;--ink:#f6ebdd;--mute:#b8a692;--pri:#ff8a3d;--pri2:#43301f;--line:#3d3126}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.bud{color:var(--pri);font-size:1.6rem;font-weight:700}
input[type=range]{width:100%;accent-color:var(--pri);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.count{color:var(--mute);font-size:.85rem;margin-top:8px}
.result{text-align:center;padding:26px 16px;background:var(--pri2);border-color:transparent}
.emoji{font-size:4rem;line-height:1.1}
.name{font-size:1.5rem;font-weight:700;margin:6px 0 2px;min-height:2.2rem}
.price{color:var(--pri);font-weight:700;font-size:1.15rem}
.tag{color:var(--mute);font-size:.85rem}
.spin .name,.spin .emoji{opacity:.55}
button.go{width:100%;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:1.15rem;padding:14px;border-radius:14px;cursor:pointer;margin-top:4px}
button.go:disabled{opacity:.5}
button.go:active{transform:scale(.98)}
h2{font-size:1rem;margin:0 0 8px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{background:var(--pri2);border-radius:99px;padding:3px 10px;font-size:.85rem}
.empty{color:var(--mute);font-size:.9rem}
ul.ls{list-style:none;padding:0;margin:8px 0 4px;text-align:left}
ul.ls li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<main>
  <h1>🍚 วันนี้กินอะไรดี?</h1>
  <p class="sub">เลือกงบ แล้วให้เราสุ่มมื้อเที่ยงให้</p>

  <div class="card">
    <label for="b">งบมื้อนี้ <span class="bud"><span id="bv">50</span> ฿</span></label>
    <input type="range" id="b" min="20" max="1500" step="10" value="50">
    <div class="chips" id="cats"></div>
    <div class="count" style="margin-top:12px">จำนวนเมนู</div>
    <div class="chips" id="nums"></div>
    <div class="count" id="cnt"></div>
  </div>

  <div class="card result" id="res">
    <div class="emoji" id="em">🎲</div>
    <div class="name" id="nm">กดปุ่มเพื่อสุ่มเลย!</div>
    <ul class="ls" id="ls"></ul>
    <div class="price" id="pr"></div>
    <div class="tag" id="tg"></div>
  </div>

  <button class="go" id="go">🎲 สุ่มเลย!</button>

  <div class="card" style="margin-top:14px">
    <h2>เมนูที่สุ่มได้ล่าสุด</h2>
    <div class="hist" id="hist"><span class="empty" style="background:none;padding:0">ยังไม่มี</span></div>
  </div>
</main>

  }
  if(!res.length)return [p[Math.floor(Math.random()*p.length)]];
  const top=Math.max(...res.map(x=>x[1])),ok=res.filter(x=>x[1]>=top*0.8);
  return ok[Math.floor(Math.random()*ok.length)][0];
}
function show(r){
  const sum=r.reduce((a,f)=>a+f[1],0),b=+$("b").value;
  $("em").textContent=r.map(f=>f[2]).join(" ");
  if(r.length===1){$("nm").textContent=r[0][0];$("ls").innerHTML="";$("tg").textContent="หมวด: "+r[0][3]}
  else{$("nm").textContent="เซ็ต "+r.length+" เมนู";$("ls").innerHTML=r.map(f=>`<li><span>${f[2]} ${f[0]}</span><b>${f[1]}฿</b></li>`).join("");$("tg").textContent=""}
  $("pr").textContent="รวม "+sum+" บาท"+(b>sum?" (เหลือ "+(b-sum)+")":"");
}
function renderHist(){
  const h=$("hist");
  h.innerHTML=hist.length?hist.map(x=>`<span>${x}</span>`).join(""):'<span class="empty" style="background:none;padding:0">ยังไม่มี</span>';
}
$("cats").innerHTML=CATS.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
$("cats").onclick=e=>{
  const c=e.target.dataset.c;if(!c)return;cat=c;
  document.querySelectorAll("#cats .chip").forEach(x=>x.classList.toggle("on",x.dataset.c===c));upd();
};
$("nums").innerHTML=NUMS.map(n=>`<button class="chip${n[1]===num?" on":""}" data-n="${n[1]}">${n[0]}</button>`).join("");
$("nums").onclick=e=>{
  const n=e.target.dataset.n;if(n===undefined)return;num=+n;
  document.querySelectorAll("#nums .chip").forEach(x=>x.classList.toggle("on",+x.dataset.n===num));
};
$("b").oninput=upd;
$("go").onclick=()=>{
  if(busy)return;const p=pool();if(!p.length)return;
  busy=true;$("go").disabled=true;$("res").classList.add("spin");
  let i=0;const total=14;
  const pick=combo();
  const t=setInterval(()=>{
    i++;
    if(i>=total){
      clearInterval(t);$("res").classList.remove("spin");show(pick);
      hist=[pick.map(f=>f[0]).join(" + ")+" ("+pick.reduce((a,f)=>a+f[1],0)+"฿)",...hist].slice(0,6);
      try{localStorage.setItem("lunchHist",JSON.stringify(hist))}catch(e){}
      renderHist();busy=false;$("go").disabled=false;$("go").textContent="🎲 สุ่มใหม่";
    }else show(combo());
  },60+i*12);
};
upd();renderHist();
</script>
